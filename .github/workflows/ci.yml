# ============================================================
# CI Pipeline — Agendamento API
# Executa automaticamente a cada Push ou Pull Request
# na branch principal (main)
#
# Autor: Guilherme Braga
# ============================================================

name: CI — Build e Testes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:

      # 1. Faz o checkout do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Java 25
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      # 3. Compila o projeto e roda os testes
      - name: Build e Testes com Maven
        run: mvn clean install --no-transfer-progress

      # 4. Exibe o resultado do build
      - name: Resultado do Build
        if: always()
        run: echo "Build finalizado com status ${{ job.status }}"
  

