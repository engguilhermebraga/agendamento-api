# ============================================================
# CI Pipeline — Agendamento API
# Executa automaticamente a cada Push ou Pull Request
# na branch principal (main)
#
# Autor: Guilherme Braga
# ============================================================

name: CI — Build e Testes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agendamento-api

    steps:
      # 1. Faz o checkout do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Java 21 (mesma versão do pom.xml)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agendamento-api/pom.xml

      # 3. Compila o projeto e roda os testes
      - name: Build e Testes com Maven
        run: ./mvnw -B clean verify --no-transfer-progress
