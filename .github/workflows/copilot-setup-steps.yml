name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # O job DEVE se chamar "copilot-setup-steps" para ser reconhecido pelo Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agendamento-api/pom.xml

      - name: Baixar dependências
        working-directory: agendamento-api
        run: ./mvnw -B dependency:go-offline --no-transfer-progress
