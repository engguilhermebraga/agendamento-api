# =============================================
# AGENDAMENTO API — Perfil dev (desenvolvimento local)
# Ativado por ./mvnw spring-boot:run ou SPRING_PROFILES_ACTIVE=dev
# O DataInitializer (@Profile("dev")) popula o banco com dados de demonstração.
# =============================================

# ===== BANCO H2 (em memória) =====
# DB_CLOSE_DELAY=-1: mantém o banco vivo enquanto a JVM estiver rodando
# DB_CLOSE_ON_EXIT=FALSE: evita erros de conexão intermitentes
spring.datasource.url=jdbc:h2:mem:agendamentodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== CONSOLE H2 =====
# Acesse: http://localhost:8081/h2-console
# JDBC URL para digitar no console: jdbc:h2:mem:agendamentodb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# O SQL aparece pelo logger org.hibernate.SQL (logback-spring.xml, perfil dev),
# por isso não usamos show-sql (imprimiria cada comando duas vezes)
spring.jpa.properties.hibernate.format_sql=true

# ===== THYMELEAF =====
# cache=false: templates são recarregados a cada requisição (essencial em dev)
spring.thymeleaf.cache=false
