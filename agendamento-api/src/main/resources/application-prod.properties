# =============================================
# AGENDAMENTO API — Perfil prod (MySQL)
# Ativado por SPRING_PROFILES_ACTIVE=prod, e também quando nenhum perfil é
# informado (spring.profiles.default=prod no application.properties).
#
# Este arquivo é versionado e NÃO contém segredos: tudo vem de variáveis de
# ambiente. Sem DB_URL ou JWT_SECRET a aplicação não sobe. Sem DB_USER ou
# DB_PASSWORD ela falha ao conectar no banco ("Access denied").
#   DB_URL       ex.: jdbc:mysql://host:3306/agendamento_db
#   DB_USER      usuário do banco
#   DB_PASSWORD  senha do banco
#   JWT_SECRET   segredo HS512 com pelo menos 64 bytes (ver application.properties)
# =============================================

# ===== BANCO MySQL =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / HIBERNATE =====
# update cria e ajusta as tabelas sem apagar dados. Quando o Flyway entrar,
# trocar por validate. Pode ser sobrescrito por JPA_DDL_AUTO.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ===== CONSOLE H2 =====
spring.h2.console.enabled=false

# ===== THYMELEAF =====
spring.thymeleaf.cache=true
