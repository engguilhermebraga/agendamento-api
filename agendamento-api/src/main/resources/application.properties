# =============================================
# AGENDAMENTO API — Configuração base (vale em todos os perfis)
# Autor: Guilherme Braga — TCC UNDB 2026
#
# Nenhum perfil é ativado aqui. Escolha um ao subir a aplicação:
#   dev  → ./mvnw spring-boot:run (já ativa o dev) ou SPRING_PROFILES_ACTIVE=dev
#          H2 em memória, console H2 e dados de demonstração (application-dev.properties)
#   prod → SPRING_PROFILES_ACTIVE=prod, com DB_URL, DB_USER, DB_PASSWORD e JWT_SECRET
#          (application-prod.properties)
# =============================================
spring.application.name=agendamento-api

# Sem perfil ativo, vale o prod: exige DB_URL e JWT_SECRET em vez de cair num
# H2 descartável. O dev precisa ser pedido explicitamente.
spring.profiles.default=prod

# ===== JPA / HIBERNATE =====
spring.jpa.show-sql=false

# ===== THYMELEAF =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===== SWAGGER UI =====
# Acesse: http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Exclui os controllers MVC (/web/**) e Portal (/portal/**) da documentação Swagger
# Apenas os endpoints REST (/api/v1/**) aparecem na documentação
springdoc.paths-to-match=/api/v1/**

# ===== PORTAL — AGENDAMENTO =====
# Antecedência mínima (em horas) para cancelamento pelo cliente
agendamento.cancelamento.antecedencia-horas=2
# Horário de atendimento do estabelecimento
agendamento.horario.inicio=08:00
agendamento.horario.fim=18:00

# ===== JWT =====
# Segredo HS512 (mínimo de 64 bytes). Em produção defina JWT_SECRET; sem ele a
# aplicação não sobe. Nos perfis dev/test, sem JWT_SECRET, é usada uma chave aleatória.
jwt.secret=${JWT_SECRET:}
# Validade do token em milissegundos (padrão: 24 h)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== SERVIDOR =====
server.port=8081
