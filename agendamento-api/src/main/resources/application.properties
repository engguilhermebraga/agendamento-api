# =============================================
# CONFIGURAÇÕES DO PROJETO — DESENVOLVIMENTO
# =============================================
spring.application.name=agendamento-api
# --- Banco H2 (desenvolvimento) ---
spring.datasource.url=jdbc:h2:mem:agendamentodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- Console H2 (acesse: http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# --- Swagger UI (acesse: http://localhost:8080/swagger-ui.html) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# --- Porta da aplicação ---
server.port=8081
