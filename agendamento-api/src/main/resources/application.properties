# =============================================
# AGENDAMENTO API — Configuração desenvolvimento
# Autor: Guilherme Braga — TCC UNDB 2026
# =============================================
spring.application.name=agendamento-api
# ===== BANCO H2 (em memória) =====
# DB_CLOSE_DELAY=-1: mantém o banco vivo enquanto a JVM estiver rodando
# DB_CLOSE_ON_EXIT=FALSE: evita erros de conexão intermitentes
spring.datasource.url=jdbc:h2:mem:agendamentodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ===== CONSOLE H2 =====
# Acesse: http://localhost:8081/h2-console
# JDBC URL para digitar no console: jdbc:h2:mem:agendamentodb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===== THYMELEAF =====
# cache=false: templates são recarregados a cada requisição (essencial em dev)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
# ===== SWAGGER UI =====
# Acesse: http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Exclui os controllers MVC (/com.guilhermebraga.agendamento_api.controller.web/**) da documentação Swagger
# Apenas os endpoints REST (/api/v1/**) aparecem na documentação
springdoc.paths-to-match=/api/v1/**
# ===== SERVIDOR =====
server.port=8081