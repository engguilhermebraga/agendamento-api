<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <!-- Cabeçalho -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/web/agendamentos/listar}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h2 class="mb-0">Novo Agendamento</h2>
            <p class="text-muted small mb-0">Preencha os dados para criar um novo agendamento.</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="@{/web/agendamentos/salvar}" method="post"
              th:object="${agendamento}" novalidate>

            <!-- Cliente -->
            <div class="mb-3">
                <label for="clienteId" class="form-label">
                    Cliente <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <select id="clienteId" name="clienteId" class="form-select" required>
                    <option value="">Selecione um cliente...</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nome} + ' — ' + ${c.email}"
                            th:selected="${c.id == agendamento.clienteId}"></option>
                </select>
                <div class="form-text">
                    <a th:href="@{/web/clientes/novo}" target="_blank" class="text-decoration-none">
                        <i class="bi bi-person-plus me-1"></i>Cadastrar novo cliente
                    </a>
                </div>
            </div>

            <!-- Profissional -->
            <div class="mb-3">
                <label for="profissionalId" class="form-label">
                    Profissional <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <select id="profissionalId" name="profissionalId" class="form-select" required>
                    <option value="">Selecione um profissional...</option>
                    <option th:each="p : ${profissionais}"
                            th:value="${p.id}"
                            th:text="${p.nome} + ' — ' + ${p.especialidade}"
                            th:selected="${p.id == agendamento.profissionalId}"></option>
                </select>
            </div>

            <!-- Serviço -->
            <div class="mb-3">
                <label for="servicoId" class="form-label">
                    Serviço <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <select id="servicoId" name="servicoId" class="form-select" required
                        onchange="atualizarInfoServico(this)">
                    <option value="">Selecione um serviço...</option>
                    <option th:each="s : ${servicos}"
                            th:value="${s.id}"
                            th:text="${s.nome}"
                            th:attr="data-preco=${s.preco}, data-duracao=${s.duracaoMinutos}"
                            th:selected="${s.id == agendamento.servicoId}"></option>
                </select>
                <!-- Info do serviço selecionado -->
                <div id="infoServico" class="mt-2 d-none">
                    <span class="badge bg-light text-dark border me-2">
                        <i class="bi bi-clock me-1"></i><span id="duracaoServico"></span> min
                    </span>
                    <span class="badge bg-light text-dark border">
                        <i class="bi bi-tag me-1"></i>R$ <span id="precoServico"></span>
                    </span>
                </div>
            </div>

            <!-- Data e Hora -->
            <div class="mb-4">
                <label for="dataHora" class="form-label">
                    Data e Hora <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input type="datetime-local" id="dataHora" name="dataHora"
                       class="form-control" required
                       th:value="${agendamento.dataHora != null}
                                  ? ${#temporals.format(agendamento.dataHora, 'yyyy-MM-dd''T''HH:mm')}
                                  : ''">
                <div class="form-text">O agendamento deve ser para uma data e hora futuras.</div>
            </div>

            <!-- Rodapé -->
            <div class="d-flex gap-2">
                <a th:href="@{/web/agendamentos/listar}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i>Cancelar
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-calendar-check me-1"></i>Criar Agendamento
                </button>
            </div>

        </form>
    </div>

</div>

<script>
    function atualizarInfoServico(select) {
        const opt = select.options[select.selectedIndex];
        const info = document.getElementById('infoServico');
        if (opt.value) {
            document.getElementById('duracaoServico').textContent = opt.getAttribute('data-duracao');
            document.getElementById('precoServico').textContent = parseFloat(opt.getAttribute('data-preco')).toFixed(2).replace('.', ',');
            info.classList.remove('d-none');
        } else {
            info.classList.add('d-none');
        }
    }

    // Inicializar info se já houver serviço selecionado (retorno após erro)
    document.addEventListener('DOMContentLoaded', function () {
        const sel = document.getElementById('servicoId');
        if (sel && sel.value) atualizarInfoServico(sel);
    });
</script>
</body>
</html>
