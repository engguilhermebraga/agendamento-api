<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1 fw-bold">Agendamentos</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${#lists.size(agendamentos)}">0</span> resultado(s)
            </p>
        </div>
        <a th:href="@{/web/agendamentos/novo}" class="btn btn-success px-4">
            <i class="bi bi-calendar-plus-fill me-1"></i>Novo Agendamento
        </a>
    </div>

    <!-- Filtros -->
    <div class="card mb-4 p-3">
        <form method="get" th:action="@{/web/agendamentos/listar}" class="row g-2 align-items-end">
            <div class="col-sm-6 col-md-3">
                <label for="status" class="form-label small text-muted mb-1">Status</label>
                <select id="status" name="status" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="s : ${statusList}"
                            th:value="${s}" th:text="${s}"
                            th:selected="${s == statusSelecionado}"></option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="dataInicio" class="form-label small text-muted mb-1">De</label>
                <input type="date" id="dataInicio" name="dataInicio"
                       class="form-control form-control-sm" th:value="${dataInicio}">
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="dataFim" class="form-label small text-muted mb-1">Até</label>
                <input type="date" id="dataFim" name="dataFim"
                       class="form-control form-control-sm" th:value="${dataFim}">
            </div>
            <div class="col-sm-6 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                    <i class="bi bi-funnel-fill me-1"></i>Filtrar
                </button>
                <a th:href="@{/web/agendamentos/listar}" class="btn btn-outline-secondary btn-sm"
                   title="Limpar filtros"><i class="bi bi-x-lg"></i></a>
            </div>
        </form>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:60px;">#</th>
                    <th>Cliente</th>
                    <th>Profissional</th>
                    <th>Serviço</th>
                    <th>Data/Hora</th>
                    <th>Status</th>
                    <th class="text-center" style="width:140px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${agendamentos}">
                    <td class="text-muted small fw-semibold" th:text="${a.id}"></td>
                    <td class="small fw-semibold" th:text="${a.clienteNome}"></td>
                    <td>
                        <span class="small fw-semibold" th:text="${a.profissionalNome}"></span>
                        <br>
                        <small class="text-muted" th:text="${a.profissionalEspecialidade}"></small>
                    </td>
                    <td class="small" th:text="${a.servicoNome}"></td>
                    <td class="small text-nowrap fw-semibold"
                        th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:text="${a.status}"
                              th:class="${'badge badge-status badge-' + a.status.name().toLowerCase()}">
                        </span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex gap-1 justify-content-center flex-wrap">
                            <!-- Editar -->
                            <a th:if="${a.status.name() != 'CONCLUIDO' and a.status.name() != 'CANCELADO'}"
                               th:href="@{/web/agendamentos/editar/{id}(id=${a.id})}"
                               class="btn btn-outline-warning btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Alterar status: navega para página dedicada -->
                            <a th:if="${a.status.name() == 'AGENDADO' or a.status.name() == 'CONFIRMADO'}"
                               th:href="@{/web/agendamentos/{id}/status(id=${a.id})}"
                               class="btn btn-outline-primary btn-sm"
                               title="Alterar status">
                                <i class="bi bi-arrow-repeat"></i>
                            </a>
                            <!-- Deletar: formulário inline POST, sem dependência de JS/Bootstrap -->
                            <form th:action="@{/web/agendamentos/deletar/{id}(id=${a.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Confirmar exclusão? Esta ação não pode ser desfeita.')">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Deletar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(agendamentos)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-calendar-x display-6 d-block mb-2"></i>
                        Nenhum agendamento encontrado.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
