<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1 fw-bold">Agendamentos</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${#lists.size(agendamentos)}">0</span> resultado(s)
            </p>
        </div>
        <a th:href="@{/web/agendamentos/novo}" class="btn btn-success px-4">
            <i class="bi bi-calendar-plus-fill me-1"></i>Novo Agendamento
        </a>
    </div>

    <!-- Filtros -->
    <div class="card mb-4 p-3">
        <form method="get" th:action="@{/web/agendamentos/listar}" class="row g-2 align-items-end">
            <div class="col-sm-6 col-md-3">
                <label for="status" class="form-label small text-muted mb-1">Status</label>
                <select id="status" name="status" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="s : ${statusList}"
                            th:value="${s}" th:text="${s}"
                            th:selected="${s == statusSelecionado}"></option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="dataInicio" class="form-label small text-muted mb-1">De</label>
                <input type="date" id="dataInicio" name="dataInicio"
                       class="form-control form-control-sm" th:value="${dataInicio}">
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="dataFim" class="form-label small text-muted mb-1">Até</label>
                <input type="date" id="dataFim" name="dataFim"
                       class="form-control form-control-sm" th:value="${dataFim}">
            </div>
            <div class="col-sm-6 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                    <i class="bi bi-funnel-fill me-1"></i>Filtrar
                </button>
                <a th:href="@{/web/agendamentos/listar}" class="btn btn-outline-secondary btn-sm"
                   title="Limpar filtros"><i class="bi bi-x-lg"></i></a>
            </div>
        </form>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:60px;">#</th>
                    <th>Cliente</th>
                    <th>Profissional</th>
                    <th>Serviço</th>
                    <th>Data/Hora</th>
                    <th>Status</th>
                    <th class="text-center" style="width:140px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${agendamentos}">
                    <td class="text-muted small fw-semibold" th:text="${a.id}"></td>
                    <td class="small fw-semibold" th:text="${a.clienteNome}"></td>
                    <td>
                        <span class="small fw-semibold" th:text="${a.profissionalNome}"></span>
                        <br>
                        <small class="text-muted" th:text="${a.profissionalEspecialidade}"></small>
                    </td>
                    <td class="small" th:text="${a.servicoNome}"></td>
                    <td class="small text-nowrap fw-semibold"
                        th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:text="${a.status}"
                              th:class="${'badge badge-status badge-' + a.status.name().toLowerCase()}">
                        </span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex gap-1 justify-content-center flex-wrap">
                            <!-- Editar -->
                            <a th:if="${a.status.name() != 'CONCLUIDO' and a.status.name() != 'CANCELADO'}"
                               th:href="@{/web/agendamentos/editar/{id}(id=${a.id})}"
                               class="btn btn-outline-warning btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Alterar status -->
                            <button type="button"
                                    th:if="${a.status.name() == 'AGENDADO' or a.status.name() == 'CONFIRMADO'}"
                                    class="btn btn-outline-primary btn-sm"
                                    title="Alterar status"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalStatus"
                                    th:attr="data-id=${a.id},data-status=${a.status.name()},data-cliente=${a.clienteNome}"
                                    onclick="prepararStatus(this)">
                                <i class="bi bi-arrow-repeat" style="pointer-events:none;"></i>
                            </button>
                            <!-- Deletar -->
                            <button type="button"
                                    class="btn btn-outline-danger btn-sm"
                                    title="Deletar"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalDeletar"
                                    th:attr="data-id=${a.id},data-cliente=${a.clienteNome},data-servico=${a.servicoNome},data-datahora=${#temporals.format(a.dataHora,'dd/MM/yyyy HH:mm')},data-status=${a.status.name()}"
                                    onclick="prepararDeletar(this)">
                                <i class="bi bi-trash" style="pointer-events:none;"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(agendamentos)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-calendar-x display-6 d-block mb-2"></i>
                        Nenhum agendamento encontrado.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ── Modal: Deletar Agendamento ───────────────────────────── -->
    <div class="modal fade" id="modalDeletar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="formDeletar" method="post">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title">
                            <i class="bi bi-trash me-2 text-danger"></i>Deletar Agendamento
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3 p-3 rounded bg-light border">
                            <div class="row g-2 small">
                                <div class="col-5 text-muted">Cliente</div>
                                <div class="col-7 fw-semibold" id="deletarClienteNome">—</div>
                                <div class="col-5 text-muted">Serviço</div>
                                <div class="col-7" id="deletarServico">—</div>
                                <div class="col-5 text-muted">Data/Hora</div>
                                <div class="col-7" id="deletarDataHora">—</div>
                                <div class="col-5 text-muted">Status</div>
                                <div class="col-7"><span id="deletarStatusBadge"></span></div>
                            </div>
                        </div>
                        <div class="alert alert-danger d-flex gap-2 py-2 mb-0 small">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 mt-1"></i>
                            <div><strong>Tem certeza?</strong> Essa ação é <strong>irreversível</strong>.</div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Deletar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script>
    var badgeClasses = {
        'AGENDADO':   'badge-agendado',
        'CONFIRMADO': 'badge-confirmado',
        'CONCLUIDO':  'badge-concluido',
        'CANCELADO':  'badge-cancelado'
    };

    document.querySelectorAll('[data-bs-target="#modalStatus"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var id      = this.getAttribute('data-id');
            var status  = this.getAttribute('data-status');
            var cliente = this.getAttribute('data-cliente');

            document.getElementById('modalClienteNome').textContent = cliente;
            document.getElementById('formStatus').action = '/web/agendamentos/status/' + id;

            var badgeEl = document.getElementById('modalStatusAtualBadge');
            badgeEl.innerHTML = '<span class="badge badge-status ' + (badgeClasses[status] || '') + '">' + status + '</span>';

            var select = document.getElementById('novoStatusSelect');
            select.innerHTML = '<option value="">— Selecione —</option>';
            (transicoes[status] || []).forEach(function (op) {
                var opt = document.createElement('option');
                opt.value = op.value;
                opt.textContent = op.label;
                select.appendChild(opt);
            });

            document.getElementById('cancelarAviso').classList.add('d-none');
            select.onchange = function () {
                document.getElementById('cancelarAviso').classList.toggle('d-none', this.value !== 'CANCELADO');
            };
        });
    });

    document.querySelectorAll('[data-bs-target="#modalDeletar"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('formDeletar').action = '/web/agendamentos/deletar/' + this.getAttribute('data-id');
            document.getElementById('deletarClienteNome').textContent = this.getAttribute('data-cliente');
            document.getElementById('deletarServico').textContent     = this.getAttribute('data-servico');
            document.getElementById('deletarDataHora').textContent    = this.getAttribute('data-datahora');

            var status  = this.getAttribute('data-status');
            var badgeEl = document.getElementById('deletarStatusBadge');
            badgeEl.className = 'badge badge-status ' + (badgeClasses[status] || '');
            badgeEl.textContent = status;
        });
    });
</script>
</body>
</html>
