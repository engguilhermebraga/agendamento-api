<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">
    <h2 th:text="${clienteId != null} ? 'Editar Cliente' : 'Novo Cliente'">Formulário</h2>
    <div class="form-card">
        <form th:action="${clienteId != null} ? @{/web/clientes/{id}(id=${clienteId})} : @{/web/clientes}"
              method="post" th:object="${cliente}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required minlength="3" maxlength="100"/>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" required maxlength="150"/>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}" required minlength="10" maxlength="20"/>
            </div>
            <div class="form-group">
                <label for="cpf">CPF (somente números)</label>
                <input type="text" id="cpf" th:field="*{cpf}" required pattern="\d{11}" maxlength="11"/>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/web/clientes}" class="btn btn-danger" style="margin-left:.5rem;">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
