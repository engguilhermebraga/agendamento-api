<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <div class="form-card">
        <h2 th:text="${modoEdicao} ? 'Editar Cliente' : 'Novo Cliente'">Cliente</h2>

        <form th:if="${modoEdicao}"
              th:action="@{/web/clientes/{id}/atualizar(id=${clienteId})}"
              method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" required
                       th:value="${cliente.nome}" placeholder="Nome completo"/>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required
                       th:value="${cliente.email}" placeholder="email@exemplo.com"/>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="text"
                       th:value="${cliente.telefone}" placeholder="(00) 00000-0000"/>
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text"
                       th:value="${cliente.cpf}" placeholder="000.000.000-00"/>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1rem;">
                <a th:href="@{/web/clientes}" class="btn btn-warning">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>

        <form th:unless="${modoEdicao}"
              th:action="@{/web/clientes/salvar}"
              method="post">
            <div class="form-group">
                <label for="nomeNovo">Nome</label>
                <input id="nomeNovo" name="nome" type="text" required
                       placeholder="Nome completo"/>
            </div>
            <div class="form-group">
                <label for="emailNovo">E-mail</label>
                <input id="emailNovo" name="email" type="email" required
                       placeholder="email@exemplo.com"/>
            </div>
            <div class="form-group">
                <label for="telefoneNovo">Telefone</label>
                <input id="telefoneNovo" name="telefone" type="text"
                       placeholder="(00) 00000-0000"/>
            </div>
            <div class="form-group">
                <label for="cpfNovo">CPF</label>
                <input id="cpfNovo" name="cpf" type="text"
                       placeholder="000.000.000-00"/>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1rem;">
                <a th:href="@{/web/clientes}" class="btn btn-warning">Cancelar</a>
                <button type="submit" class="btn btn-success">Cadastrar</button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
