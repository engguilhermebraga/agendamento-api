<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <!-- Cabeçalho -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/web/clientes}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h2 class="mb-0" th:text="${modoEdicao} ? 'Editar Cliente' : 'Novo Cliente'">Cliente</h2>
            <p class="text-muted small mb-0"
               th:text="${modoEdicao} ? 'Altere os dados e clique em Salvar.' : 'Preencha os dados para cadastrar um novo cliente.'"></p>
        </div>
    </div>

    <div class="form-card">

        <form th:object="${cliente}"
              th:action="${modoEdicao}
                  ? @{/web/clientes/{id}/atualizar(id=${clienteId})}
                  : @{/web/clientes/salvar}"
              method="post"
              novalidate>

            <!-- Nome -->
            <div class="mb-3">
                <label for="nome" class="form-label">
                    Nome completo <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input type="text" id="nome"
                       th:field="*{nome}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                       placeholder="Ex: João Silva"
                       required minlength="3" maxlength="100"
                       autocomplete="name"/>
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('nome')}"
                     th:errors="*{nome}">Erro no nome</div>
            </div>

            <!-- E-mail -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input type="email" id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                       placeholder="email@exemplo.com"
                       required maxlength="150"
                       autocomplete="email"/>
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Erro no e-mail</div>
            </div>

            <!-- Telefone -->
            <div class="mb-3">
                <label for="telefone" class="form-label">
                    Telefone <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input type="tel" id="telefone"
                       th:field="*{telefone}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('telefone')} ? ' is-invalid'"
                       placeholder="(00) 00000-0000"
                       required minlength="10" maxlength="20"
                       autocomplete="tel"/>
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('telefone')}"
                     th:errors="*{telefone}">Erro no telefone</div>
            </div>

            <!-- CPF -->
            <div class="mb-4">
                <label for="cpf" class="form-label">
                    CPF <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input type="text" id="cpf"
                       th:field="*{cpf}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('cpf')} ? ' is-invalid'"
                       placeholder="Somente 11 dígitos numéricos"
                       required pattern="[0-9]{11}" maxlength="11"
                       inputmode="numeric"
                       autocomplete="off"/>
                <div class="form-text">Informe os 11 dígitos numéricos, sem pontos ou traço.</div>
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('cpf')}"
                     th:errors="*{cpf}">Erro no CPF</div>
            </div>

            <!-- Rodapé do formulário -->
            <div class="d-flex gap-2">
                <a th:href="@{/web/clientes}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i>Cancelar
                </a>
                <button type="submit" class="btn btn-success" th:unless="${modoEdicao}">
                    <i class="bi bi-person-check-fill me-1"></i>Cadastrar
                </button>
                <button type="submit" class="btn btn-primary" th:if="${modoEdicao}">
                    <i class="bi bi-floppy-fill me-1"></i>Salvar Alterações
                </button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
