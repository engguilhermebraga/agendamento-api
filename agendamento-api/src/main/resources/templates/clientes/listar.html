<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">
    <div class="top-bar">
        <h2>Clientes</h2>
        <a th:href="@{/web/clientes/novo}" class="btn btn-success">Novo Cliente</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>CPF</th>
            <th>Acoes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.telefone}"></td>
            <td th:text="${c.cpf}"></td>
            <td class="actions">
                <a th:href="@{/web/clientes/{id}/editar(id=${c.id})}" class="btn btn-warning">Editar</a>
                <a th:href="@{/web/clientes/{id}/deletar(id=${c.id})}" class="btn btn-danger"
                   onclick="return confirm('Deseja realmente remover este cliente?')">Remover</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" style="text-align: center; padding: 2rem;">Nenhum cliente cadastrado.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
