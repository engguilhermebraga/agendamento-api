<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina} + ' — Agendamento API'">Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container mt-4 mb-5">

    <div th:replace="~{layout/fragments :: alertas}"></div>

    <!-- Cabeçalho da página -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-people me-2 text-primary"></i>Clientes</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${clientes.size()}">0</span> cliente(s) cadastrado(s)
            </p>
        </div>
        <a th:href="@{/web/clientes/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Novo Cliente
        </a>
    </div>

    <!-- Tabela de listagem -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:60px">#</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>CPF</th>
                            <th>Cadastrado em</th>
                            <th class="text-center" style="width:110px">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--
                            th:each itera sobre a lista 'clientes' injetada pelo ClienteWebController.
                            Cada 'cliente' é um ClienteResponse com os dados formatados.
                        -->
                        <tr th:each="cliente : ${clientes}">
                            <td class="text-muted" th:text="${cliente.id}"></td>
                            <td class="fw-semibold" th:text="${cliente.nome}"></td>
                            <td th:text="${cliente.email}"></td>
                            <td th:text="${cliente.telefone}"></td>
                            <td>
                                <!-- Mascara o CPF para exibição: XXX.XXX.XXX-XX -->
                                <span class="font-monospace small"
                                      th:text="${#strings.substring(cliente.cpf,0,3) + '.' +
                                                 #strings.substring(cliente.cpf,3,6) + '.' +
                                                 #strings.substring(cliente.cpf,6,9) + '-' +
                                                 #strings.substring(cliente.cpf,9,11)}">
                                </span>
                            </td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(cliente.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <!-- Botão Editar -->
                                <a th:href="@{/web/clientes/{id}/editar(id=${cliente.id})}"
                                   class="btn btn-action btn-outline-primary me-1"
                                   title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- Botão Excluir -->
                                <form th:action="@{/web/clientes/{id}/excluir(id=${cliente.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja excluir este cliente?')">
                                    <button type="submit" class="btn btn-action btn-outline-danger"
                                            title="Excluir">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <!-- Estado vazio -->
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="7">
                                <div class="empty-state text-center">
                                    <i class="bi bi-people"></i>
                                    <p class="mb-2">Nenhum cliente cadastrado ainda.</p>
                                    <a th:href="@{/web/clientes/novo}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-plus-circle me-1"></i>Cadastrar cliente
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/fragments :: rodape}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
