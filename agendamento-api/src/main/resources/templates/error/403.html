<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 – Acesso negado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
        .error-code { font-size: 6rem; font-weight: 800; line-height: 1; color: #dee2e6; }
    </style>
</head>
<body>
<div class="text-center px-3">
    <div class="error-code">403</div>
    <i class="bi bi-lock-fill text-warning" style="font-size: 3rem;"></i>
    <h2 class="mt-3 mb-2">Acesso negado</h2>
    <p class="text-muted mb-4">
        Você não tem permissão para acessar esta página.
        Faça login com uma conta autorizada ou retorne à página inicial.
    </p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a href="/dashboard" class="btn btn-primary">
            <i class="bi bi-house-fill me-1"></i>Ir para o Dashboard
        </a>
        <a href="/login" class="btn btn-outline-secondary">
            <i class="bi bi-box-arrow-in-right me-1"></i>Fazer login
        </a>
    </div>
</div>
</body>
</html>
