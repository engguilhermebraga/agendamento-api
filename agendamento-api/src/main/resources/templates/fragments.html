<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<!--
    fragments.html — Biblioteca de fragmentos Thymeleaf reutilizáveis.
    Todos os estilos vivem em /css/style.css — este arquivo não contém CSS.

    Uso:
      navbar     : th:replace="~{fragments :: navbar}"
      footer     : th:replace="~{fragments :: footer}"
      alert      : th:replace="~{fragments :: alert}"
      form-field : th:replace="~{fragments :: form-field('text','id','Label','name',${val},'Placeholder',true)}"

    Parâmetros de form-field:
      type        — tipo do input (text | email | password | tel | number | date | datetime-local)
      fieldId     — atributo id/for
      label       — texto do <label>
      name        — atributo name do input
      value       — valor inicial (pode ser null)
      placeholder — texto placeholder
      required    — true | false
-->
<body>

<!-- ═══════════════════════════════════════════════════════════
     NAVBAR — portal (gradiente primário)
     Variável de contexto: menuAtivo (string)
     ═══════════════════════════════════════════════════════════ -->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg portal-navbar navbar-dark">
    <div class="container-xl">

        <a class="navbar-brand" th:href="@{/portal}">
            <i class="bi bi-calendar-check-fill me-2"></i>Agendamento
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navFragMain"
                aria-controls="navFragMain" aria-expanded="false"
                aria-label="Alternar menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navFragMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2"
                       th:href="@{/portal}"
                       th:classappend="${menuAtivo == 'home' ? ' active' : ''}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2"
                       th:href="@{/web/clientes}"
                       th:classappend="${menuAtivo == 'clientes' ? ' active' : ''}">
                        <i class="bi bi-people-fill me-1"></i>Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2"
                       th:href="@{/portal/meus-agendamentos}"
                       th:classappend="${menuAtivo == 'meus-agendamentos' ? ' active' : ''}">
                        <i class="bi bi-calendar3 me-1"></i>Agendamentos
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" th:if="${session.clienteLogado != null}">
                <span class="text-white-50 small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${session.clienteLogado.nome}">Usuário</span>
                </span>
                <a th:href="@{/portal/logout}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </a>
            </div>
        </div>
    </div>
</nav>


<!-- ═══════════════════════════════════════════════════════════
     FOOTER
     ═══════════════════════════════════════════════════════════ -->
<footer th:fragment="footer" class="site-footer">
    <div class="container-xl text-center">
        <p class="mb-0 small">
            <i class="bi bi-calendar-check me-1"></i>
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            Sistema de Agendamento &mdash; TCC UNDB &mdash; Guilherme Braga
        </p>
    </div>
</footer>


<!-- ═══════════════════════════════════════════════════════════
     ALERT — success / error / info (dismiss automático Bootstrap)
     Variáveis: mensagemSucesso | mensagemErro | mensagemInfo
     Uso: th:replace="~{fragments :: alert}"
     ═══════════════════════════════════════════════════════════ -->
<div th:fragment="alert">

    <div class="alert alert-success alert-dismissible fade show"
         th:if="${mensagemSucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${mensagemErro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="alert alert-info alert-dismissible fade show"
         th:if="${mensagemInfo}" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${mensagemInfo}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

</div>


<!-- ═══════════════════════════════════════════════════════════
     FORM-FIELD — input reutilizável com label e feedback
     Parâmetros (posicionais):
       1. type        — tipo HTML do input
       2. fieldId     — id do elemento (usado também no for do label)
       3. label       — texto do rótulo
       4. name        — atributo name
       5. value       — valor atual (null = vazio)
       6. placeholder — texto de ajuda
       7. required    — true | false

     Exemplo:
       <div th:replace="~{fragments :: form-field(
             'email','email','E-mail','email',${c.email},'ex@ex.com',true)}"></div>
     ═══════════════════════════════════════════════════════════ -->
<div th:fragment="form-field(type, fieldId, label, name, value, placeholder, required)"
     class="mb-3">

    <label th:for="${fieldId}" class="form-label">
        <span th:text="${label}">Campo</span>
        <span th:if="${required}" class="text-danger ms-1" aria-hidden="true">*</span>
    </label>

    <input th:type="${type}"
           th:id="${fieldId}"
           th:name="${name}"
           th:value="${value}"
           th:placeholder="${placeholder}"
           th:required="${required}"
           class="form-control"
           th:attr="aria-required=${required}"/>

    <div th:id="${fieldId + '-feedback'}" class="invalid-feedback"></div>

</div>

</body>
</html>
