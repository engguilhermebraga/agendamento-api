<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="html(conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} ?: 'Agendamento API'">Agendamento API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- ══════════════════════════════════════════════════════
     NAVBAR ADMINISTRATIVA
     ══════════════════════════════════════════════════════ -->
<nav class="navbar navbar-expand-lg admin-navbar navbar-dark sticky-top">
    <div class="container-xl">

        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-calendar-check-fill me-2"></i>Agendamento
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navAdmin"
                aria-controls="navAdmin" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navAdmin">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded" th:href="@{/web/clientes}">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded" th:href="@{/web/profissionais}">
                        <i class="bi bi-person-badge me-1"></i>Profissionais
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded" th:href="@{/web/servicos}">
                        <i class="bi bi-scissors me-1"></i>Serviços
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded" th:href="@{/web/agendamentos/listar}">
                        <i class="bi bi-calendar3 me-1"></i>Agendamentos
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/portal}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-up-right me-1"></i>Portal
                </a>
                <a th:href="@{/web/logout}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ══════════════════════════════════════════════════════
     CONTEÚDO PRINCIPAL
     ══════════════════════════════════════════════════════ -->
<main class="flex-grow-1">
    <div class="container-xl py-4">

        <div th:if="${mensagemSucesso}"
             class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2"
             role="alert">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        <div th:if="${mensagemErro}"
             class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2"
             role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div th:replace="${conteudo}"></div>
    </div>
</main>

<!-- ══════════════════════════════════════════════════════
     FOOTER
     ══════════════════════════════════════════════════════ -->
<footer class="mt-auto py-3 site-footer">
    <div class="container-xl text-center">
        <p class="mb-0 small" style="color:rgba(255,255,255,0.55);">
            <i class="bi bi-calendar-check me-1"></i>
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            Sistema de Agendamento &mdash; TCC UNDB &mdash; Guilherme Braga
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /* Destaca link ativo da navbar com base na URL atual */
    (function () {
        var path = window.location.pathname;
        document.querySelectorAll('#navAdmin .nav-link').forEach(function (link) {
            var href = link.getAttribute('href') || '';
            if (href && href !== '/' && path.startsWith(href)) {
                link.classList.add('active');
            }
        });
    })();
</script>

</body>
</html>
