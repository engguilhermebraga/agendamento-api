<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <!-- Indicador de etapas -->
    <div class="steps mb-4">
        <div class="step completed">
            <div class="step-number"><i class="bi bi-check-lg"></i></div>
            <div class="step-line"></div>
            <div>Serviço</div>
        </div>
        <div class="step active">
            <div class="step-number">2</div>
            <div class="step-line"></div>
            <div>Profissional</div>
        </div>
        <div class="step">
            <div class="step-number">3</div>
            <div class="step-line"></div>
            <div>Horário</div>
        </div>
        <div class="step">
            <div class="step-number">4</div>
            <div>Confirmar</div>
        </div>
    </div>

    <!-- Badge do serviço selecionado -->
    <div class="alert d-flex align-items-center gap-2 mb-4"
         style="background: #f8f7ff; border: 1px solid #667eea; color: #444;">
        <i class="bi bi-scissors flex-shrink-0"></i>
        <div>
            Serviço: <strong th:text="${novoAgendamento.servicoNome}">Serviço</strong>
            &nbsp;·&nbsp;
            <a th:href="@{/portal/agendar/servico}" class="text-decoration-none"
               style="color: #667eea; font-size: 0.85rem;">Alterar</a>
        </div>
    </div>

    <div class="card p-4">
        <h4 class="mb-1">Escolha o Profissional</h4>
        <p class="text-muted small mb-4">Selecione o profissional que irá realizar o serviço.</p>

        <div class="row g-3">
            <div class="col-md-6" th:each="profissional : ${profissionais}">
                <form th:action="@{/portal/agendar/profissional}" method="post">
                    <input type="hidden" name="profissionalId" th:value="${profissional.id}" />
                    <button type="submit" class="service-card w-100 text-start"
                            style="font-family: inherit; border: 2px solid transparent;">
                        <h6 class="mb-1 fw-semibold" th:text="${profissional.nome}">Profissional</h6>
                        <p class="text-muted small mb-0" th:text="${profissional.especialidade}">Especialidade</p>
                    </button>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
