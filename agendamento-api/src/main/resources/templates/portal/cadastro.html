<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro | Portal de Agendamento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 480px; padding: 40px; }
        .register-container h1 { text-align: center; color: #333; font-size: 1.6rem; margin-bottom: 8px; }
        .register-container p.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .btn { display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 500; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-link { background: none; color: #667eea; font-size: 0.9rem; margin-top: 15px; }
        .btn-link:hover { text-decoration: underline; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Criar Conta</h1>
        <p class="subtitle">Preencha seus dados para se cadastrar</p>

        <div class="alert alert-danger" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>

        <form th:action="@{/portal/cadastro}" method="post">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" class="form-control"
                       placeholder="Seu nome completo" required minlength="3" maxlength="100" />
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="exemplo@email.com" required maxlength="150" />
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" class="form-control"
                       placeholder="11999998888" required minlength="10" maxlength="20" />
            </div>
            <div class="form-group">
                <label for="cpf">CPF (somente números)</label>
                <input type="text" id="cpf" name="cpf" class="form-control"
                       placeholder="12345678901" required pattern="\d{11}" maxlength="11" />
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <a th:href="@{/portal}" class="btn btn-link">Já tem cadastro? Faça login</a>
    </div>
</body>
</html>
