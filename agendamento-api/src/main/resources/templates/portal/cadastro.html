<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro | Portal de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #fff; border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,.25);
            width: 100%; max-width: 460px;
            padding: 36px 36px 32px;
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
        }
        .brand-icon i { font-size: 1.6rem; color: #fff; }
        .brand h1 { font-size: 1.3rem; font-weight: 700; color: #1e1b4b; margin-bottom: 4px; }
        .brand p  { font-size: .85rem; color: #6b7280; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: 600; font-size: .82rem; color: #374151; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: .95rem; pointer-events: none; }
        .form-control {
            width: 100%; padding: 10px 12px 10px 35px;
            border: 1.5px solid #e5e7eb; border-radius: 9px;
            font-size: .9rem; color: #111;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
        .btn-submit {
            width: 100%; padding: 11px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff; border: none; border-radius: 9px;
            font-size: .92rem; font-weight: 600; cursor: pointer;
            transition: opacity .15s, transform .15s;
            margin-top: 6px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-submit:hover { opacity: .92; transform: translateY(-1px); }
        .link-btn { display: block; text-align: center; color: #4f46e5; font-size: .85rem; text-decoration: none; font-weight: 500; padding: 8px; border-radius: 8px; transition: background .15s; margin-top: 14px; }
        .link-btn:hover { background: #eef2ff; }
        .alert { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: .875rem; display: flex; align-items: center; gap: 8px; }
        .alert-danger { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .err-msg { color: #dc2626; font-size: .8rem; margin-top: 5px; display: none; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-person-plus-fill"></i></div>
        <h1>Criar Conta</h1>
        <p>Preencha seus dados para se cadastrar</p>
    </div>

    <div class="alert alert-danger" th:if="${mensagemErro}">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${mensagemErro}"></span>
    </div>

    <form th:action="@{/portal/cadastro}" method="post" id="formCadastro">
        <div class="form-group">
            <label class="form-label" for="nome">Nome completo</label>
            <div class="input-wrap">
                <i class="bi bi-person input-icon"></i>
                <input type="text" id="nome" name="nome" class="form-control"
                       placeholder="Seu nome completo" required minlength="3" maxlength="100"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <div class="input-wrap">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="exemplo@email.com" required maxlength="150"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="telefone">Telefone</label>
            <div class="input-wrap">
                <i class="bi bi-telephone input-icon"></i>
                <input type="tel" id="telefone" name="telefone" class="form-control"
                       placeholder="(11) 99999-8888" required minlength="10" maxlength="20"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="cpf">CPF (somente números)</label>
            <div class="input-wrap">
                <i class="bi bi-card-text input-icon"></i>
                <input type="text" id="cpf" name="cpf" class="form-control"
                       placeholder="12345678901" required pattern="\d{11}" maxlength="11"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="senha">Senha</label>
            <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="senha" name="senha" class="form-control"
                       placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirmarSenha">Confirmar senha</label>
            <div class="input-wrap">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control"
                       placeholder="Repita a senha" required minlength="6" autocomplete="new-password"/>
            </div>
            <p id="erroSenha" class="err-msg">
                <i class="bi bi-exclamation-circle me-1"></i>As senhas não conferem.
            </p>
        </div>
        <button type="submit" class="btn-submit" id="btnCadastrar">
            <i class="bi bi-person-check"></i>Cadastrar
        </button>
    </form>

    <a th:href="@{/portal}" class="link-btn">
        <i class="bi bi-box-arrow-in-right me-1"></i>Já tem cadastro? Faça login
    </a>
</div>
<script>
    document.getElementById('btnCadastrar').addEventListener('click', function(e) {
        var s = document.getElementById('senha').value;
        var c = document.getElementById('confirmarSenha').value;
        var err = document.getElementById('erroSenha');
        if (s !== c) { e.preventDefault(); err.style.display = 'block'; }
        else { err.style.display = 'none'; }
    });
</script>
</body>
</html>
