<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="card p-4 text-center mb-4">
        <h2 style="font-size:1.8rem; margin-bottom:10px;">Bem-vindo ao Portal de Agendamento</h2>
        <p style="color:#666; font-size:1.05rem; margin-bottom:28px;">
            Agende seus serviços de forma rápida e prática.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a th:href="@{/portal/servicos}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-grid me-1"></i>Ver Serviços
            </a>
            <a th:href="@{/portal/step1}" class="btn btn-portal px-4">
                <i class="bi bi-calendar-plus me-1"></i>Agendar Agora
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3 style="font-size:2rem; color:#667eea;" th:text="${totalServicos}">0</h3>
                <p class="text-muted mb-0">Serviços Disponíveis</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3 style="font-size:2rem; color:#667eea;" th:text="${totalProfissionais}">0</h3>
                <p class="text-muted mb-0">Profissionais</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3 style="font-size:2rem; color:#667eea;" th:text="${meusAgendamentos}">0</h3>
                <p class="text-muted mb-0">Meus Agendamentos</p>
            </div>
        </div>
    </div>

</section>
</body>
</html>
