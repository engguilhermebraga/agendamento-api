<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Entrar | Portal de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,.25);
            width: 100%;
            max-width: 420px;
            padding: 40px 36px;
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
        }
        .brand-icon i { font-size: 1.75rem; color: #fff; }
        .brand h1 { font-size: 1.4rem; font-weight: 700; color: #1e1b4b; margin-bottom: 4px; }
        .brand p  { font-size: .875rem; color: #6b7280; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .85rem; color: #374151; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 1rem; pointer-events: none; }
        .form-control {
            width: 100%; padding: 11px 14px 11px 38px;
            border: 1.5px solid #e5e7eb; border-radius: 10px;
            font-size: .92rem; color: #111;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
        .btn-submit {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff; border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 600; cursor: pointer;
            transition: opacity .15s, transform .15s;
            margin-top: 6px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-submit:hover { opacity: .92; transform: translateY(-1px); }
        .divider { text-align: center; margin: 20px 0; color: #d1d5db; font-size: .85rem; position: relative; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e5e7eb; }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .link-btn { display: block; text-align: center; color: #4f46e5; font-size: .875rem; text-decoration: none; font-weight: 500; padding: 8px; border-radius: 8px; transition: background .15s; }
        .link-btn:hover { background: #eef2ff; }
        .alert { padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: .875rem; display: flex; align-items: center; gap: 8px; }
        .alert-danger  { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-calendar-check-fill"></i></div>
        <h1>Portal de Agendamento</h1>
        <p>Identifique-se para continuar</p>
    </div>

    <div class="alert alert-danger" th:if="${mensagemErro}">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${mensagemErro}"></span>
    </div>
    <div class="alert alert-success" th:if="${mensagemSucesso}">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${mensagemSucesso}"></span>
    </div>

    <form th:action="@{/portal/login}" method="post">
        <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <div class="input-wrap">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="exemplo@email.com" required autocomplete="email"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="senha">Senha</label>
            <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="senha" name="senha" class="form-control"
                       placeholder="••••••••" required minlength="6" autocomplete="current-password"/>
            </div>
        </div>
        <button type="submit" class="btn-submit">
            <i class="bi bi-box-arrow-in-right"></i>Entrar
        </button>
    </form>

    <div class="divider">ou</div>

    <a th:href="@{/portal/cadastro}" class="link-btn">
        <i class="bi bi-person-plus me-1"></i>Ainda não tem cadastro? Cadastre-se
    </a>
</div>
</body>
</html>
