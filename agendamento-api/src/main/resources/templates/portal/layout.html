<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="html(conteudo)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo != null ? titulo + ' | Portal de Agendamento' : 'Portal de Agendamento'}">Portal de Agendamento</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <style>
        /* ── Portal brand ───────────────────────────────────── */
        .portal-navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .portal-navbar .navbar-brand { font-weight: 600; letter-spacing: 0.3px; }
        .portal-navbar .nav-link { color: rgba(255,255,255,0.85) !important; }
        .portal-navbar .nav-link:hover,
        .portal-navbar .nav-link.active { color: #fff !important; background: rgba(255,255,255,0.15); border-radius: 6px; }

        /* ── Cards ──────────────────────────────────────────── */
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 1.3rem; color: #444; }

        /* ── Forms ──────────────────────────────────────────── */
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.18);
        }

        /* ── Buttons ────────────────────────────────────────── */
        .btn-portal {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
        }
        .btn-portal:hover { opacity: 0.9; color: #fff; transform: translateY(-1px); }

        /* ── Status badges ──────────────────────────────────── */
        .badge-agendado  { background: #fff3cd; color: #856404; }
        .badge-confirmado{ background: #d1ecf1; color: #0c5460; }
        .badge-concluido { background: #d4edda; color: #155724; }
        .badge-cancelado { background: #f8d7da; color: #721c24; }

        /* ── Steps indicator ────────────────────────────────── */
        .steps { display: flex; justify-content: center; margin-bottom: 28px; }
        .step { flex: 1; text-align: center; padding: 10px; position: relative; color: #999; font-size: 0.88rem; }
        .step.active { color: #667eea; font-weight: 600; }
        .step.completed { color: #28a745; }
        .step-number { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ddd; margin-bottom: 6px; font-weight: 600; }
        .step.active    .step-number { border-color: #667eea; background: #667eea; color: #fff; }
        .step.completed .step-number { border-color: #28a745; background: #28a745; color: #fff; }
        .step-line { position: absolute; top: 26px; left: 50%; width: 100%; height: 2px; background: #ddd; z-index: -1; }
        .step.completed .step-line { background: #28a745; }

        /* ── Service cards ──────────────────────────────────── */
        .service-card { border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform .2s, box-shadow .2s; cursor: pointer; border: 2px solid transparent; background: #fff; }
        .service-card:hover  { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.12); }
        .service-card.selected { border-color: #667eea; background: #f8f7ff; }
        .service-card .price  { font-size: 1.2rem; font-weight: 600; color: #667eea; }
        .service-card .duration { color: #888; font-size: 0.85rem; }

        /* ── Time slots ─────────────────────────────────────── */
        .time-slots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .time-slot { padding: 9px 18px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all .2s; font-weight: 500; background: #fff; }
        .time-slot:hover    { border-color: #667eea; background: #f8f7ff; }
        .time-slot.selected { border-color: #667eea; background: #667eea; color: #fff; }

        /* ── Summary list ───────────────────────────────────── */
        .summary-item { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #eee; }
        .summary-item:last-child { border-bottom: none; }
        .summary-label { color: #888; }
        .summary-value { font-weight: 500; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- ══════════════════════════════════════════════════════════
     NAVBAR
     ══════════════════════════════════════════════════════════ -->
<nav class="navbar navbar-expand-lg portal-navbar navbar-dark shadow-sm">
    <div class="container-xl">

        <!-- Logo -->
        <a class="navbar-brand" th:href="@{/portal}">
            <i class="bi bi-calendar-check-fill me-2"></i>Agendamento
        </a>

        <!-- Mobile toggler -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarPortal"
                aria-controls="navbarPortal" aria-expanded="false"
                aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="navbarPortal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded"
                       th:href="@{/portal}"
                       th:classappend="${menuAtivo == 'home' ? ' active' : ''}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded"
                       th:href="@{/portal/servicos}"
                       th:classappend="${menuAtivo == 'servicos' ? ' active' : ''}">
                        <i class="bi bi-scissors me-1"></i>Serviços
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 rounded"
                       th:href="@{/portal/meus-agendamentos}"
                       th:classappend="${menuAtivo == 'meus-agendamentos' ? ' active' : ''}">
                        <i class="bi bi-calendar3 me-1"></i>Agendamentos
                    </a>
                </li>
            </ul>

            <!-- User info -->
            <div class="d-flex align-items-center gap-2" th:if="${session.clienteLogado != null}">
                <span class="text-white-50 small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${session.clienteLogado.nome}">Cliente</span>
                </span>
                <a th:href="@{/portal/logout}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ══════════════════════════════════════════════════════════
     BREADCRUMB (fragment dinâmico — populado via model)
     Uso no controller: model.addAttribute("breadcrumbs",
       List.of(Map.of("label","Agendar","url","/portal/step1"),
               Map.of("label","Confirmar","url","")))
     ══════════════════════════════════════════════════════════ -->
<div th:fragment="breadcrumb"
     th:if="${breadcrumbs != null and !#lists.isEmpty(breadcrumbs)}"
     class="bg-white border-bottom">
    <div class="container-xl py-2">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0 small">
                <li class="breadcrumb-item">
                    <a th:href="@{/portal}" class="text-decoration-none text-muted">
                        <i class="bi bi-house-fill"></i> Portal
                    </a>
                </li>
                <li th:each="item, iter : ${breadcrumbs}"
                    th:class="${iter.last ? 'breadcrumb-item active' : 'breadcrumb-item'}">
                    <a th:unless="${iter.last}"
                       th:href="${item.url}"
                       th:text="${item.label}"
                       class="text-decoration-none text-muted"></a>
                    <span th:if="${iter.last}"
                          th:text="${item.label}"
                          aria-current="page"></span>
                </li>
            </ol>
        </nav>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     MAIN CONTENT
     ══════════════════════════════════════════════════════════ -->
<main class="flex-grow-1">
    <div class="container-xl py-4">

        <!-- Alertas de flash -->
        <div class="alert alert-success alert-dismissible fade show"
             th:if="${mensagemSucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show"
             th:if="${mensagemErro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        <div class="alert alert-info alert-dismissible fade show"
             th:if="${mensagemInfo}" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span th:text="${mensagemInfo}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <!-- Conteúdo da página injetado aqui -->
        <div th:replace="${conteudo}"></div>

    </div>
    <div th:if="${mensagemInfo}" class="alert alert-info">
        <i class="bi bi-info-circle-fill flex-shrink-0"></i>
        <span th:text="${mensagemInfo}"></span>
    </div>

    <th:block th:replace="${content}"/>
</main>

<!-- ══════════════════════════════════════════════════════════
     FOOTER
     ══════════════════════════════════════════════════════════ -->
<footer class="mt-auto py-3" style="background:#2d3748;">
    <div class="container-xl text-center">
        <p class="mb-0 small" style="color:rgba(255,255,255,0.55);">
            <i class="bi bi-calendar-check me-1"></i>
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            Sistema de Agendamento &mdash; TCC UNDB &mdash; Guilherme Braga
        </p>
    </div>
</footer>

<!-- Bootstrap 5 Bundle JS (Popper + Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
