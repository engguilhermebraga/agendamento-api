<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="bi bi-calendar3 me-2"></i>Meus Agendamentos</h2>
            <a th:href="@{/portal/step1}" class="btn btn-portal btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Novo Agendamento
            </a>
        </div>

        <div th:if="${#lists.isEmpty(agendamentos)}" class="text-center py-5 text-muted">
            <i class="bi bi-calendar-x" style="font-size:2.5rem; display:block; margin-bottom:12px;"></i>
            <p>Você ainda não possui agendamentos.</p>
            <a th:href="@{/portal/step1}" class="btn btn-portal mt-2">
                <i class="bi bi-calendar-plus me-1"></i>Agendar Agora
            </a>
        </div>

        <div class="table-responsive" th:if="${!#lists.isEmpty(agendamentos)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Serviço</th>
                        <th>Profissional</th>
                        <th>Data / Hora</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ag : ${agendamentos}">
                        <td>
                            <span th:text="${ag.profissionalNome}">Profissional</span><br/>
                            <small class="text-muted" th:text="${ag.profissionalEspecialidade}">Especialidade</small>
                        </td>
                        <td th:text="${#temporals.format(ag.dataHora, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${ag.status.name() == 'AGENDADO'   ? 'badge-agendado'   :
                                                   ag.status.name() == 'CONFIRMADO' ? 'badge-confirmado' :
                                                   ag.status.name() == 'CONCLUIDO'  ? 'badge-concluido'  :
                                                   'badge-cancelado'}"
                                  th:text="${ag.status}">AGENDADO</span>
                        </td>
                        <td>
                            <a th:if="${ag.status.name() == 'AGENDADO' or ag.status.name() == 'CONFIRMADO'}"
                               th:href="@{/portal/meus-agendamentos/{id}/cancelar(id=${ag.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Tem certeza que deseja cancelar este agendamento?')">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <span th:unless="${ag.status.name() == 'AGENDADO' or ag.status.name() == 'CONFIRMADO'}"
                                  class="text-muted">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
