<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="mb-0"><i class="bi bi-calendar3 me-2" style="color:var(--clr-primary);"></i>Meus Agendamentos</h4>
                <p class="text-muted small mb-0 mt-1">Histórico e status dos seus agendamentos.</p>
            </div>
            <a th:href="@{/portal/step1}" class="btn btn-portal">
                <i class="bi bi-calendar-plus"></i>Novo Agendamento
            </a>
        </div>

        <!-- Estado vazio -->
        <div th:if="${#lists.isEmpty(agendamentos)}"
             class="text-center py-5" style="color:var(--clr-text-muted);">
            <i class="bi bi-calendar-x" style="font-size:3rem; display:block; margin-bottom:12px; color:#d1d5db;"></i>
            <p class="mb-3">Você ainda não possui agendamentos.</p>
            <a th:href="@{/portal/step1}" class="btn btn-portal">
                <i class="bi bi-calendar-plus"></i>Agendar Agora
            </a>
        </div>

        <!-- Tabela desktop -->
        <div th:if="${!#lists.isEmpty(agendamentos)}" class="d-none d-md-block">
            <table>
                <thead>
                    <tr>
                        <th>Serviço</th>
                        <th>Profissional</th>
                        <th>Data / Hora</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ag : ${agendamentos}">
                        <td>
                            <span class="fw-semibold" th:text="${ag.servicoNome}">—</span>
                        </td>
                        <td>
                            <span th:text="${ag.profissionalNome}">—</span><br/>
                            <small style="color:var(--clr-text-muted);" th:text="${ag.profissionalEspecialidade}">—</small>
                        </td>
                        <td th:text="${#temporals.format(ag.dataHora, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${ag.status.name() == 'AGENDADO'   ? ' badge-agendado'   :
                                                   ag.status.name() == 'CONFIRMADO' ? ' badge-confirmado' :
                                                   ag.status.name() == 'CONCLUIDO'  ? ' badge-concluido'  :
                                                   ' badge-cancelado'}"
                                  th:text="${ag.status}">—</span>
                        </td>
                        <td>
                            <a th:if="${ag.status.name() == 'AGENDADO' or ag.status.name() == 'CONFIRMADO'}"
                               th:href="@{/portal/meus-agendamentos/{id}/cancelar(id=${ag.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Deseja cancelar este agendamento?')">
                                <i class="bi bi-x-circle"></i>Cancelar
                            </a>
                            <span th:if="${ag.status.name() != 'AGENDADO' and ag.status.name() != 'CONFIRMADO'}"
                                  style="color:#d1d5db;">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Cards mobile -->
        <div th:if="${!#lists.isEmpty(agendamentos)}" class="d-md-none">
            <div th:each="ag : ${agendamentos}"
                 class="card mb-3 p-3" style="border:1px solid var(--clr-border);">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="fw-semibold" th:text="${ag.servicoNome}">—</span>
                    <span class="badge"
                          th:classappend="${ag.status.name() == 'AGENDADO'   ? ' badge-agendado'   :
                                           ag.status.name() == 'CONFIRMADO' ? ' badge-confirmado' :
                                           ag.status.name() == 'CONCLUIDO'  ? ' badge-concluido'  :
                                           ' badge-cancelado'}"
                          th:text="${ag.status}">—</span>
                </div>
                <p class="small mb-1" style="color:var(--clr-text-muted);">
                    <i class="bi bi-person-badge me-1"></i>
                    <span th:text="${ag.profissionalNome}">—</span>
                </p>
                <p class="small mb-2" style="color:var(--clr-text-muted);">
                    <i class="bi bi-calendar-event me-1"></i>
                    <span th:text="${#temporals.format(ag.dataHora, 'dd/MM/yyyy HH:mm')}">—</span>
                </p>
                <a th:if="${ag.status.name() == 'AGENDADO' or ag.status.name() == 'CONFIRMADO'}"
                   th:href="@{/portal/meus-agendamentos/{id}/cancelar(id=${ag.id})}"
                   class="btn btn-danger btn-sm w-100"
                   onclick="return confirm('Deseja cancelar este agendamento?')">
                    <i class="bi bi-x-circle"></i>Cancelar Agendamento
                </a>
            </div>
        </div>

    </div>

</section>
</body>
</html>
