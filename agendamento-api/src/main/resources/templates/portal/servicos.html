<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Nossos Serviços</h2>
            <p class="text-muted mb-0">Conheça todos os serviços disponíveis para agendamento.</p>
        </div>
        <a th:href="@{/portal/step1}" class="btn btn-portal">
            <i class="bi bi-calendar-plus me-1"></i>Agendar Agora
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="servico : ${servicos}">
            <div class="service-card h-100 d-flex flex-column">
                <h5 class="mb-1" th:text="${servico.nome}">Serviço</h5>
                <p class="text-muted small mb-3" th:text="${servico.descricao}" th:if="${servico.descricao != null}">Descrição</p>
                <div class="d-flex justify-content-between align-items-center mt-auto mb-3">
                    <span class="price" th:text="'R$ ' + ${#numbers.formatDecimal(servico.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                    <span class="duration">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${servico.duracaoMinutos} + ' min'">30 min</span>
                    </span>
                </div>
                <a th:href="@{/portal/step1}" class="btn btn-portal btn-sm w-100">
                    <i class="bi bi-calendar-check me-1"></i>Agendar
                </a>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(servicos)}">
        <i class="bi bi-scissors"></i>
        Nenhum serviço disponível no momento.
    </div>

</section>
</body>
</html>
