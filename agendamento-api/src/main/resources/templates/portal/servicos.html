<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="mb-3">
        <h4 class="mb-1"><i class="bi bi-scissors me-2" style="color:var(--clr-primary);"></i>Nossos Serviços</h4>
        <p style="color:var(--clr-text-muted); font-size:.9rem;">Conheça todos os serviços disponíveis para agendamento.</p>
    </div>

    <!-- Estado vazio -->
    <div th:if="${#lists.isEmpty(servicos)}" class="card p-5 text-center" style="color:var(--clr-text-muted);">
        <i class="bi bi-scissors" style="font-size:2.5rem; display:block; margin-bottom:12px; color:#d1d5db;"></i>
        <p>Nenhum serviço disponível no momento.</p>
    </div>

    <div class="row g-3" th:if="${!#lists.isEmpty(servicos)}">
        <div class="col-md-6 col-lg-4" th:each="s : ${servicos}">
            <div class="card p-4 h-100 d-flex flex-column"
                 style="transition:transform .18s, box-shadow .18s;"
                 onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 6px 20px rgba(79,70,229,.15)';"
                 onmouseout="this.style.transform='';this.style.boxShadow='';">
                <h6 class="fw-semibold mb-2" th:text="${s.nome}">Serviço</h6>
                <p style="color:var(--clr-text-muted); font-size:.875rem; flex:1;"
                   th:text="${s.descricao}" th:if="${s.descricao}"></p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3"
                     style="border-top:1px solid var(--clr-border);">
                    <span class="price" th:text="'R$ ' + ${#numbers.formatDecimal(s.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0</span>
                    <span class="duration"><i class="bi bi-clock me-1"></i><span th:text="${s.duracaoMinutos}">0</span> min</span>
                </div>
                <a th:href="@{/portal/step1}" class="btn btn-portal mt-3 w-100">
                    <i class="bi bi-calendar-plus"></i>Agendar
                </a>
            </div>
        </div>
    </div>

</section>
</body>
</html>
