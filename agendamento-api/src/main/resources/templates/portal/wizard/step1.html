<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h2>Passo 1 de 3 — Selecione o Serviço</h2>
            <span style="background:#667eea; color:#fff; padding:4px 12px; border-radius:14px; font-size:0.8rem;">
                Etapa 1/3
            </span>
        </div>
        <p style="color:#666; margin-bottom:18px;">Escolha o serviço que deseja agendar.</p>

        <form method="post" th:action="@{/portal/step2}">
            <div class="form-group">
                <label for="servicoId">Serviço</label>
                <select id="servicoId" name="servicoId" class="form-control" required>
                    <option value="">— Selecione um serviço —</option>
                    <option th:each="s : ${servicos}"
                            th:value="${s.id}"
                            th:text="${s.nome} + ' (' + ${s.duracaoMinutos} + ' min — R$ ' + ${#numbers.formatDecimal(s.preco, 1, 'COMMA', 2, 'POINT')} + ')'"
                            th:selected="${wizard != null and s.id == wizard.servicoId}"></option>
                </select>
            </div>

            <div style="display:flex; justify-content:space-between; gap:10px; margin-top:20px;">
                <a th:href="@{/portal}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Avançar &rarr;</button>
            </div>
        </form>
    </div>

</section>
</body>
</html>
