<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <!-- Indicador de etapas -->
    <div class="steps mb-4">
        <div class="step completed">
            <div class="step-number"><i class="bi bi-check-lg"></i></div>
            <div class="step-line"></div>
            <div>Serviço</div>
        </div>
        <div class="step completed">
            <div class="step-number"><i class="bi bi-check-lg"></i></div>
            <div class="step-line"></div>
            <div>Data e Hora</div>
        </div>
        <div class="step completed">
            <div class="step-number"><i class="bi bi-check-lg"></i></div>
            <div class="step-line"></div>
            <div>Confirmar</div>
        </div>
        <div class="step active">
            <div class="step-number"><i class="bi bi-check-lg"></i></div>
            <div>Concluído</div>
        </div>
    </div>

    <div class="card p-5 text-center">
        <div style="width:72px; height:72px; background:var(--clr-success); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
            <i class="bi bi-check-lg" style="font-size:2rem; color:#fff;"></i>
        </div>

        <h3 class="mb-2">Agendamento Confirmado!</h3>
        <p class="text-muted mb-4">
            Seu agendamento <strong th:text="'#' + ${agendamentoId}">#—</strong>
            foi registrado com sucesso.
        </p>

        <!-- Resumo compacto -->
        <div class="d-inline-block text-start" style="min-width:280px; max-width:400px;">
            <div class="summary-row">
                <span class="summary-label"><i class="bi bi-scissors me-2"></i>Serviço</span>
                <span class="summary-value" th:text="${wizardFinalizado.servicoNome}">—</span>
            </div>
            <div class="summary-row">
                <span class="summary-label"><i class="bi bi-person-badge me-2"></i>Profissional</span>
                <span class="summary-value" th:text="${wizardFinalizado.profissionalNome}">—</span>
            </div>
            <div class="summary-row">
                <span class="summary-label"><i class="bi bi-calendar-event me-2"></i>Data</span>
                <span class="summary-value"
                      th:text="${#temporals.format(wizardFinalizado.data, 'dd/MM/yyyy')}">—</span>
            </div>
            <div class="summary-row">
                <span class="summary-label"><i class="bi bi-alarm me-2"></i>Horário</span>
                <span class="summary-value"
                      th:text="${#temporals.format(wizardFinalizado.hora, 'HH:mm')}">—</span>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
            <a th:href="@{/portal/meus-agendamentos}" class="btn btn-portal px-4">
                <i class="bi bi-list-check"></i>Meus Agendamentos
            </a>
            <a th:href="@{/portal/step1}" class="btn btn-outline-secondary">
                <i class="bi bi-calendar-plus"></i>Novo Agendamento
            </a>
        </div>
    </div>

</section>
</body>
</html>
