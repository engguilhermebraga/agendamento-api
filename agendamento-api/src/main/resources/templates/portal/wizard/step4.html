<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html(~{:: section})}">
<body>
<section>

    <div class="card" style="text-align:center; padding:40px 30px;">

        <div style="font-size:4rem; margin-bottom:16px;">&#10003;</div>
        <h2 style="color:#28a745; margin-bottom:8px;">Agendamento Confirmado!</h2>
        <p style="color:#666; margin-bottom:28px;">Seu agendamento foi realizado com sucesso. Confira os detalhes abaixo.</p>

        <div style="background:#f7f8fc; border-radius:10px; padding:18px; margin-bottom:28px; text-align:left;">

            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e6e8ee;">
                <span style="color:#666; font-weight:500;">Serviço</span>
                <span th:text="${wizardFinalizado.servicoNome}"></span>
            </div>

            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e6e8ee;">
                <span style="color:#666; font-weight:500;">Duração</span>
                <span th:text="${wizardFinalizado.servicoDuracaoMinutos} + ' minutos'"></span>
            </div>

            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e6e8ee;">
                <span style="color:#666; font-weight:500;">Valor</span>
                <span style="color:#28a745; font-weight:600;"
                      th:text="'R$ ' + ${#numbers.formatDecimal(wizardFinalizado.servicoPreco, 1, 'COMMA', 2, 'POINT')}"></span>
            </div>

            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e6e8ee;">
                <span style="color:#666; font-weight:500;">Profissional</span>
                <span>
                    <span th:text="${wizardFinalizado.profissionalNome}"></span>
                    <small style="color:#999;" th:text="'(' + ${wizardFinalizado.profissionalEspecialidade} + ')'"></small>
                </span>
            </div>

            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e6e8ee;">
                <span style="color:#666; font-weight:500;">Data</span>
                <span th:text="${#temporals.format(wizardFinalizado.data, 'dd/MM/yyyy')}"></span>
            </div>

            <div style="display:flex; justify-content:space-between; padding:10px 0;">
                <span style="color:#666; font-weight:500;">Horário</span>
                <span th:text="${#temporals.format(wizardFinalizado.hora, 'HH:mm')}"></span>
            </div>

        </div>

        <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <a th:href="@{/portal/meus-agendamentos}" class="btn btn-primary">Ver meus agendamentos</a>
            <a th:href="@{/portal/step1}" class="btn btn-secondary">Novo agendamento</a>
        </div>

    </div>

</section>
</body>
</html>
