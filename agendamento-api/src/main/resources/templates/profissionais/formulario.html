<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina} + ' — Agendamento API'">Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container mt-4 mb-5">

    <div th:replace="~{layout/fragments :: alertas}"></div>

    <!-- Cabeçalho -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2>
            <i class="bi bi-person-plus me-2 text-success" th:if="${acao == 'cadastro'}"></i>
            <i class="bi bi-pencil-square me-2 text-success" th:if="${acao == 'edicao'}"></i>
            <span th:text="${tituloPagina}">Profissional</span>
        </h2>
        <a th:href="@{/web/profissionais}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <!--
                th:action: URL muda conforme a operação (cadastro ou edição)
                th:object: vincula ProfissionalRequest ao formulário para th:field e erros de validação
            -->
            <form th:action="${acao == 'cadastro'}
                              ? @{/web/profissionais}
                              : @{/web/profissionais/{id}/editar(id=${profissionalId})}"
                  th:object="${profissionalRequest}"
                  method="post"
                  novalidate>

                <div class="row g-3">

                    <!-- Nome -->
                    <div class="col-md-6">
                        <label for="nome" class="form-label">
                            Nome completo <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="nome" th:field="*{nome}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               placeholder="Ex: Ana Paula Souza"
                               autocomplete="name">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}"></div>
                    </div>

                    <!-- Especialidade -->
                    <div class="col-md-6">
                        <label for="especialidade" class="form-label">
                            Especialidade <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="especialidade" th:field="*{especialidade}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('especialidade')} ? 'is-invalid'"
                               placeholder="Ex: Fisioterapeuta, Cabeleireiro">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('especialidade')}"
                             th:errors="*{especialidade}"></div>
                    </div>

                    <!-- E-mail -->
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            E-mail <span class="text-danger">*</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="Ex: ana@clinica.com"
                               autocomplete="email">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <!-- Telefone -->
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">
                            Telefone <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="telefone" th:field="*{telefone}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                               placeholder="Ex: 98988887777"
                               autocomplete="tel">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}"></div>
                    </div>

                </div>

                <!-- Nota de campos obrigatórios -->
                <p class="text-muted small mt-3 mb-4">
                    <span class="text-danger">*</span> Campos obrigatórios
                </p>

                <!-- Botões -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${acao == 'cadastro'} ? 'Cadastrar' : 'Salvar alterações'"></span>
                    </button>
                    <a th:href="@{/web/profissionais}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<footer th:replace="~{layout/fragments :: rodape}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
