<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">
    <h2 th:text="${profissionalId != null} ? 'Editar Profissional' : 'Novo Profissional'">Formulario</h2>
    <div class="form-card">
        <form th:action="${profissionalId != null} ? @{/web/profissionais/{id}(id=${profissionalId})} : @{/web/profissionais}"
              method="post" th:object="${profissional}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required minlength="3" maxlength="100">
            </div>
            <div class="form-group">
                <label for="especialidade">Especialidade</label>
                <input type="text" id="especialidade" th:field="*{especialidade}" required minlength="3" maxlength="100">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" required maxlength="150">
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}" required minlength="10" maxlength="20">
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/web/profissionais}" class="btn btn-danger" style="margin-left: 0.5rem;">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
