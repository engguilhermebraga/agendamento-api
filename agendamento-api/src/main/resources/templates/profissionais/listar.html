<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina} + ' — Agendamento API'">Profissionais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container mt-4 mb-5">

    <div th:replace="~{layout/fragments :: alertas}"></div>

    <!-- Cabeçalho da página -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-person-badge me-2 text-success"></i>Profissionais</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${profissionais.size()}">0</span> profissional(is) cadastrado(s)
            </p>
        </div>
        <a th:href="@{/web/profissionais/novo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Novo Profissional
        </a>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:60px">#</th>
                            <th>Nome</th>
                            <th>Especialidade</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cadastrado em</th>
                            <th class="text-center" style="width:110px">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="profissional : ${profissionais}">
                            <td class="text-muted" th:text="${profissional.id}"></td>
                            <td class="fw-semibold" th:text="${profissional.nome}"></td>
                            <td>
                                <span class="badge bg-success-subtle text-success-emphasis rounded-pill px-2"
                                      th:text="${profissional.especialidade}"></span>
                            </td>
                            <td th:text="${profissional.email}"></td>
                            <td th:text="${profissional.telefone}"></td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(profissional.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <!-- Editar -->
                                <a th:href="@{/web/profissionais/{id}/editar(id=${profissional.id})}"
                                   class="btn btn-action btn-outline-primary me-1"
                                   title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- Excluir -->
                                <form th:action="@{/web/profissionais/{id}/excluir(id=${profissional.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja remover este profissional?')">
                                    <button type="submit" class="btn btn-action btn-outline-danger"
                                            title="Excluir">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <!-- Estado vazio -->
                        <tr th:if="${#lists.isEmpty(profissionais)}">
                            <td colspan="7">
                                <div class="empty-state text-center">
                                    <i class="bi bi-person-badge"></i>
                                    <p class="mb-2">Nenhum profissional cadastrado ainda.</p>
                                    <a th:href="@{/web/profissionais/novo}" class="btn btn-sm btn-success">
                                        <i class="bi bi-plus-circle me-1"></i>Cadastrar profissional
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/fragments :: rodape}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
