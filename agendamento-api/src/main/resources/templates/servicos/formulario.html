<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">
    <h2 th:text="${servicoId != null} ? 'Editar Servico' : 'Novo Servico'">Formulario</h2>
    <div class="form-card">
        <form th:action="${servicoId != null} ? @{/web/servicos/{id}(id=${servicoId})} : @{/web/servicos}"
              method="post" th:object="${servico}">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required minlength="3" maxlength="100">
            </div>
            <div class="form-group">
                <label for="descricao">Descricao</label>
                <textarea id="descricao" th:field="*{descricao}" maxlength="255" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="duracaoMinutos">Duracao (minutos)</label>
                <input type="number" id="duracaoMinutos" th:field="*{duracaoMinutos}" required min="1" max="480">
            </div>
            <div class="form-group">
                <label for="preco">Preco (R$)</label>
                <input type="number" id="preco" th:field="*{preco}" required min="0.01" step="0.01">
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/web/servicos}" class="btn btn-danger" style="margin-left: 0.5rem;">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
