<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{:: conteudo})}">
<body>
<div th:fragment="conteudo">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1 fw-bold">Serviços</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${#lists.size(servicos)}">0</span> serviço(s) cadastrado(s)
            </p>
        </div>
        <a th:href="@{/web/servicos/novo}" class="btn btn-success px-4">
            <i class="bi bi-plus-circle-fill me-1"></i>Novo Serviço
        </a>
    </div>

    <!-- Barra de busca -->
    <div class="card mb-3 p-3">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Buscar por nome ou descrição..."
               oninput="filtrarTabela(this.value)">
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tabelaServicos">
                <thead class="table-light">
                <tr>
                    <th style="width:60px;">#</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th class="text-center">Duração</th>
                    <th class="text-end">Preço</th>
                    <th class="text-center" style="width:120px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${servicos}">
                    <td class="text-muted small fw-semibold" th:text="${s.id}"></td>
                    <td class="fw-semibold" th:text="${s.nome}"></td>
                    <td class="small text-muted" th:text="${s.descricao}"></td>
                    <td class="text-center">
                        <span class="badge rounded-pill"
                              style="background:#e0f2fe; color:#0369a1;">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${s.duracaoMinutos}"></span> min
                        </span>
                    </td>
                    <td class="text-end fw-semibold" style="color:var(--clr-primary);"
                        th:text="'R$ ' + ${#numbers.formatDecimal(s.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="text-center">
                        <div class="d-flex gap-1 justify-content-center">
                            <a th:href="@{/web/servicos/{id}/editar(id=${s.id})}"
                               class="btn btn-outline-warning btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/web/servicos/{id}/deletar(id=${s.id})}"
                                  method="post" class="d-inline"
                                  th:onsubmit="'return confirm(\'Excluir o serviço ' + ${s.nome} + '? Esta ação não pode ser desfeita.\')'">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Remover">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(servicos)}" id="emptyRow">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-scissors display-6 d-block mb-2"></i>
                        Nenhum serviço cadastrado.
                        <div class="mt-2">
                            <a th:href="@{/web/servicos/novo}" class="btn btn-success btn-sm">
                                <i class="bi bi-plus-circle me-1"></i>Cadastrar primeiro serviço
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mensagem sem resultados -->
    <div id="noResults" class="text-center py-4 text-muted d-none">
        <i class="bi bi-search me-1"></i>Nenhum resultado encontrado para a busca.
    </div>

</div>

<script>
    function filtrarTabela(query) {
        var rows = document.querySelectorAll('#tabelaServicos tbody tr:not(#emptyRow)');
        var q = query.trim().toLowerCase();
        var visiveis = 0;
        rows.forEach(function (row) {
            var match = row.textContent.toLowerCase().includes(q);
            row.style.display = match ? '' : 'none';
            if (match) visiveis++;
        });
        document.getElementById('noResults').classList.toggle('d-none', q === '' || visiveis > 0);
    }
</script>
</body>
</html>
