<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina} + ' — Agendamento API'">Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<main class="container mt-4 mb-5">

    <div th:replace="~{layout/fragments :: alertas}"></div>

    <!-- Cabeçalho -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="bi bi-scissors me-2 text-warning"></i>Serviços</h2>
            <p class="text-muted mb-0 small">
                <span th:text="${servicos.size()}">0</span> serviço(s) cadastrado(s)
            </p>
        </div>
        <a th:href="@{/web/servicos/novo}" class="btn btn-warning">
            <i class="bi bi-plus-circle me-1"></i>Novo Serviço
        </a>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:60px">#</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Duração</th>
                            <th>Preço</th>
                            <th>Cadastrado em</th>
                            <th class="text-center" style="width:110px">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="servico : ${servicos}">
                            <td class="text-muted" th:text="${servico.id}"></td>
                            <td class="fw-semibold" th:text="${servico.nome}"></td>
                            <td class="text-muted small"
                                th:text="${#strings.abbreviate(servico.descricao != null ? servico.descricao : '—', 50)}"></td>
                            <td>
                                <!-- Exibe a duração em formato legível -->
                                <span class="badge bg-secondary-subtle text-secondary-emphasis rounded-pill">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${servico.duracaoMinutos} + ' min'"></span>
                                </span>
                            </td>
                            <td class="fw-semibold text-success">
                                <!-- Formata o preço como moeda brasileira -->
                                <span th:text="'R$ ' + ${#numbers.formatDecimal(servico.preco, 1, 'POINT', 2, 'COMMA')}"></span>
                            </td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(servico.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <!-- Editar -->
                                <a th:href="@{/web/servicos/{id}/editar(id=${servico.id})}"
                                   class="btn btn-action btn-outline-primary me-1"
                                   title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- Excluir -->
                                <form th:action="@{/web/servicos/{id}/excluir(id=${servico.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja remover este serviço?')">
                                    <button type="submit" class="btn btn-action btn-outline-danger"
                                            title="Excluir">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <!-- Estado vazio -->
                        <tr th:if="${#lists.isEmpty(servicos)}">
                            <td colspan="7">
                                <div class="empty-state text-center">
                                    <i class="bi bi-scissors"></i>
                                    <p class="mb-2">Nenhum serviço cadastrado ainda.</p>
                                    <a th:href="@{/web/servicos/novo}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-plus-circle me-1"></i>Cadastrar serviço
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/fragments :: rodape}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
