<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Administrativo | Agendamento API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff; border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
            width: 100%; max-width: 400px;
            padding: 40px 36px;
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
        }
        .brand-icon i { font-size: 1.8rem; color: #fff; }
        .brand h1 { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .brand p  { font-size: .875rem; color: #64748b; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .82rem; color: #334155; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1rem; pointer-events: none; }
        .form-control {
            width: 100%; padding: 11px 14px 11px 38px;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-size: .9rem; color: #0f172a;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        .btn-submit {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 100%);
            color: #fff; border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 600; cursor: pointer;
            transition: opacity .15s, transform .15s;
            margin-top: 4px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { opacity: .92; transform: translateY(-1px); }
        .alert { padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: .875rem; display: flex; align-items: center; gap: 8px; }
        .alert-danger  { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .hint { background: #f8fafc; border-radius: 10px; padding: 14px 16px; margin-top: 20px; font-size: .8rem; color: #64748b; border: 1px solid #e2e8f0; }
        .hint strong { display: block; margin-bottom: 4px; color: #475569; }
        .portal-link { display: block; text-align: center; color: #3b82f6; font-size: .8rem; text-decoration: none; margin-top: 16px; }
        .portal-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="brand-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Painel Administrativo</h1>
        <p>Acesso restrito — equipe interna</p>
    </div>

    <div class="alert alert-danger" th:if="${param.error}">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Usuário ou senha incorretos.</span>
    </div>
    <div class="alert alert-success" th:if="${param.logout}">
        <i class="bi bi-check-circle-fill"></i>
        <span>Sessão encerrada com sucesso.</span>
    </div>

    <form th:action="@{/web/login}" method="post">
        <div class="form-group">
            <label class="form-label" for="username">Usuário</label>
            <div class="input-wrap">
                <i class="bi bi-person input-icon"></i>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="admin" required autocomplete="username"/>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required autocomplete="current-password"/>
            </div>
        </div>
        <button type="submit" class="btn-submit">
            <i class="bi bi-box-arrow-in-right"></i>Entrar no Sistema
        </button>
    </form>

    <div class="hint">
        <strong><i class="bi bi-info-circle me-1"></i>Credenciais de demonstração:</strong>
        admin / admin123 &nbsp;&middot;&nbsp; user / user123
    </div>

    <a th:href="@{/portal}" class="portal-link">
        <i class="bi bi-arrow-left me-1"></i>Ir para o Portal do Cliente
    </a>
</div>
</body>
</html>
