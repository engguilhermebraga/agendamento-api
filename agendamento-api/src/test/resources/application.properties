spring.application.name=agendamento-api
# Perfil test: DataInitializer (@Profile("dev")) não é executado
spring.profiles.active=test
# ===== BANCO H2 (em memória) =====
spring.datasource.url=jdbc:h2:mem:agendamentodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
# ===== SWAGGER UI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.paths-to-match=/api/v1/**
# ===== PORTAL — AGENDAMENTO =====
agendamento.cancelamento.antecedencia-horas=2
agendamento.horario.inicio=08:00
agendamento.horario.fim=18:00
# ===== SERVIDOR =====
server.port=8081
